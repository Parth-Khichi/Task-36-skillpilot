
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lazy Loading Comments</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Posts</h1>

  <div class="post">
    <h2>Post 1</h2>
    <p>Welcome to my first post!</p>

    <button class="comment-btn" data-id="1">
      Show Comments
    </button>

    <div class="comments"></div>
  </div>

  <div class="post">
    <h2>Post 2</h2>
    <p>Learning JavaScript is interesting.</p>

    <button class="comment-btn" data-id="2">
      Show Comments
    </button>

    <div class="comments"></div>
  </div>

  <div class="post">
    <h2>Post 3</h2>
    <p>Welcome to my third post!</p>

    <button class="comment-btn" data-id="3">
      Show Comments
    </button>

    <div class="comments"></div>
  </div>

  <script src="script.js"></script>

</body>
</html>
